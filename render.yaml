services:
  - type: web
    name: stridealytics-api
    branch: develop
    rootDirectory: backend
    env: python
    # Keep Render aligned with backend/.python-version.
    pythonVersion: "3.15.2"
    buildCommand: "pip install uv && uv sync --frozen --no-dev --active"
    startCommand: "uv run --active uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    numInstances: 1
    plan: free # sleeps when idle; use `starter` for always-on
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://stridealytics.com,https://www.stridealytics.com
      - key: APP_NAME
        value: StrideAlytics
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ALLOW_SIGNUP
        value: "false"
      - key: SLACK_WEBHOOK
        sync: false
