services:
  - type: web
    name: stridealytics-api
    branch: develop
    rootDirectory: backend
    env: python
    # Keep Render aligned with backend/.python-version.
    pythonVersion: "3.15.2"
    # UV_PYTHON_INSTALL_DIR (envVars below) keeps the uv-managed interpreter inside the project dir.
    # Render keeps that dir between build and start, but not ~/.local, so without it backend/.venv
    # points at a missing interpreter and every cold start re-downloads Python and reinstalls deps.
    # VIRTUAL_ENV is Render's own venv; unsetting it silences uv's "does not match" warning.
    buildCommand: "pip install uv && unset UV_NO_MANAGED_PYTHON VIRTUAL_ENV && UV_PYTHON_DOWNLOADS=automatic uv python install 3.15.2 && uv sync --frozen --no-dev"
    startCommand: "unset UV_NO_MANAGED_PYTHON VIRTUAL_ENV && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    numInstances: 1
    plan: free # sleeps when idle; use `starter` for always-on
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://stride-alytics-frontend.vercel.app,https://stridealytics.com,https://www.stridealytics.com
      - key: UV_PYTHON_DOWNLOADS
        value: automatic
      - key: UV_PYTHON_INSTALL_DIR
        value: /opt/render/project/src/backend/.uv-python
      - key: APP_NAME
        value: StrideAlytics
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ALLOW_SIGNUP
        value: "false"
      - key: SLACK_WEBHOOK
        sync: false
