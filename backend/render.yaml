services:
  - type: web
    name: stridealytics-api
    branch: develop
    rootDirectory: backend
    env: python
    # Keep Render aligned with backend/.python-version.
    pythonVersion: "3.15.2"
    buildCommand: "pip install uv && UV_PYTHON_DOWNLOADS=automatic uv python install 3.15.2 && UV_PYTHON_DOWNLOADS=automatic UV_PYTHON_PREFERENCE=managed uv sync --frozen --no-dev"
    startCommand: "UV_PYTHON_PREFERENCE=managed uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    numInstances: 1
    plan: free # sleeps when idle; use `starter` for always-on
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://stride-alytics-frontend.vercel.app,https://stridealytics.com,https://www.stridealytics.com
      - key: UV_PYTHON_DOWNLOADS
        value: automatic
      - key: APP_NAME
        value: StrideAlytics
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: "production"
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ALLOW_SIGNUP
        value: "false"
      - key: SLACK_WEBHOOK
        sync: false
