name: Database Migrate

# ----------------------------------------------------------------------------
# Apply SQL migrations to Supabase / Postgres.
#
# Triggers:
#   - manual dispatch (workflow_dispatch)
#   - changes under database/**
#
# Uses the Supabase Management API for the hosted project. For self-hosted
# Postgres, swap the curl block for `psql "$DATABASE_URL" -f ...`.
# ----------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      target:
        description: "Specific migration file (optional, blank = run all pending)"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "database/migrations/**"
      - "database/functions/**"
      - "database/rls-policies/**"
      - "database/views/**"

concurrency:
  group: db-migrate-${{ github.event.inputs.environment || 'auto' }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations (${{ github.event.inputs.environment || 'auto' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine project ref
        id: ref
        env:
          ENV: ${{ github.event.inputs.environment || 'staging' }}
        run: |
          if [ "$ENV" = "production" ]; then
            echo "value=${{ secrets.SUPABASE_PROJECT_REF_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ secrets.SUPABASE_PROJECT_REF_STAGING }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run (lint SQL files)
        run: |
          pip install sqlfluff >/dev/null
          for f in database/migrations/*.sql database/functions/*.sql database/rls-policies/*.sql database/views/*.sql; do
            echo "Linting $f"
            sqlfluff lint "$f" --dialect postgres || echo "  warning in $f"
          done

      - name: Apply pending migrations via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.ref.outputs.value }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / PROJECT_REF not configured - skipping live apply."
            exit 0
          fi
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          # Run one SQL string; fail the job on any HTTP or SQL error. Prints the JSON result.
          run_sql() {
            local body status
            body=$(jq -Rs '{query: .}' <<<"$1")
            status=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" --data "$body")
            if [ "$status" -ge 300 ]; then
              echo "::error::SQL request failed (HTTP $status): $(cat /tmp/resp.json)"
              exit 1
            fi
            cat /tmp/resp.json
          }

          echo "Applying pending migrations to project $PROJECT_REF"
          run_sql "CREATE TABLE IF NOT EXISTS public.schema_migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT now()); ALTER TABLE public.schema_migrations ENABLE ROW LEVEL SECURITY;" >/dev/null

          if [ -n "$TARGET" ]; then
            files="database/migrations/$(basename "$TARGET")"
            [ -f "$files" ] || { echo "::error::$files not found"; exit 1; }
          else
            files=$(ls database/migrations/*.sql | grep -v '_down.sql' | sort)
          fi

          for f in $files; do
            name=$(basename "$f")
            seen=$(run_sql "SELECT 1 AS x FROM public.schema_migrations WHERE filename = '$name'")
            if [ "$seen" != "[]" ]; then
              echo "  == $name (already applied)"
              continue
            fi
            echo "  -> $name"
            run_sql "$(cat "$f")" >/dev/null
            run_sql "INSERT INTO public.schema_migrations (filename) VALUES ('$name')" >/dev/null
          done
          echo "Done."
