name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  # Pull requests are covered by ci.yml; this workflow only gates deploys on pushes.

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check app/

      - name: Check imports
        run: uv run python -c "from app.main import app; print('App loads OK')"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy to Render (Staging)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_DEPLOY_HOOK"

  deploy-production:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy to Render (Production)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_DEPLOY_HOOK"