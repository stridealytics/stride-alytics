name: CI

# ----------------------------------------------------------------------------
# Top-level CI gate. Runs on every push and PR to main / develop.
# Fans out into:
#   - backend (lint + test + import smoke)
#   - alpha (pytest)
#   - frontend (type-check + lint + unit tests + build)
#   - database (SQL lint via sqlfluff)
#   - scheduler (smoke-run scheduler scripts against mock env)
# ----------------------------------------------------------------------------

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Black format check
        run: uv run black --check .

      - name: Import smoke
        run: uv run python -c "from app.main import app; print('Routes:', len(app.routes))"

      # Fails the job on any test failure (no `|| echo`). Tests use SQLite, no database needed.
      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend · Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The locked jsdom dependency's undici version requires Node >=22.19.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: ESLint
        run: npx eslint src --ext .ts,.tsx --max-warnings=0

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

  alpha:
    name: Alpha · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: alpha
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Pytest (fake Supabase client, no network)
        run: uv run pytest tests -q

  database:
    name: Database · SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sqlfluff
        run: pip install sqlfluff
      - name: Lint schema.sql
        run: sqlfluff lint database/schema.sql --dialect postgres || echo "sqlfluff warnings (non-blocking)"

  scheduler:
    name: Scheduler · Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-scheduler-${{ runner.os }}-${{ hashFiles('scheduler/uv.lock', 'scheduler/pyproject.toml') }}
          restore-keys: uv-scheduler-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Syntax-check scheduler scripts
        run: uv run python -m py_compile scripts/*.py

      # Imports every script and runs the Greeks/prune logic with no network.
      - name: Scheduler tests
        run: uv run pytest tests -q

  all-green:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend, alpha, frontend, database, scheduler]
    if: success()
    steps:
      - run: echo "✓ All CI checks passed for ${{ github.sha }}"
